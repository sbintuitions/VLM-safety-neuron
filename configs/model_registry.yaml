# Models studied in the paper; both detection scripts take these keys (--model).
#   name             display name (README table, figures)
#   hf_repo          checkpoint on the Hugging Face Hub
#   size_b           parameters, in billions
#   num_layers       decoder layers of the language model
#   enable_thinking  passed to the chat template (absent: not passed)

models:
  qwen25vl-7b:
    name: Qwen2.5-VL-7B
    hf_repo: Qwen/Qwen2.5-VL-7B-Instruct
    size_b: 7
    num_layers: 28

  qwen3vl-2b:
    name: Qwen3-VL-2B
    hf_repo: Qwen/Qwen3-VL-2B-Instruct
    size_b: 2
    num_layers: 28

  qwen3vl-8b:
    name: Qwen3-VL-8B
    hf_repo: Qwen/Qwen3-VL-8B-Instruct
    size_b: 8
    num_layers: 36

  qwen3vl-32b:
    name: Qwen3-VL-32B
    hf_repo: Qwen/Qwen3-VL-32B-Instruct
    size_b: 32
    num_layers: 64

  qwen35-9b:
    name: Qwen3.5-9B
    hf_repo: Qwen/Qwen3.5-9B
    size_b: 9
    num_layers: 32
    enable_thinking: false

  qwen35-9b-thinking:
    name: Qwen3.5-9B-Thinking
    hf_repo: Qwen/Qwen3.5-9B
    size_b: 9
    num_layers: 32
    enable_thinking: true

  internvl-8b:
    name: InternVL3.5-8B
    hf_repo: OpenGVLab/InternVL3_5-8B
    size_b: 8
    num_layers: 36

  internvl-14b:
    name: InternVL3.5-14B
    hf_repo: OpenGVLab/InternVL3_5-14B
    size_b: 14
    num_layers: 40

  gemma4-31b:
    name: Gemma-4-31B
    hf_repo: google/gemma-4-31B-it
    size_b: 31
    num_layers: 60
    enable_thinking: false

  glm41v-9b:
    name: GLM-4.1V-9B-Thinking
    hf_repo: zai-org/GLM-4.1V-9B-Thinking
    size_b: 9
    num_layers: 40
    enable_thinking: true
